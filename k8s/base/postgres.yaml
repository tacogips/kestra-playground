apiVersion: v1
kind: Service
metadata:
  name: kestra-postgres-headless
  namespace: kestra
  labels:
    app.kubernetes.io/name: kestra-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/instance: kestra
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: kestra-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/instance: kestra
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: kestra-postgres
  namespace: kestra
  labels:
    app.kubernetes.io/name: kestra-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/instance: kestra
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kestra-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/instance: kestra
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: kestra-postgres-internal
  namespace: kestra
  labels:
    app.kubernetes.io/name: kestra-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/instance: kestra
  annotations:
    networking.gke.io/load-balancer-type: Internal
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: kestra-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/instance: kestra
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kestra-postgres-init
  namespace: kestra
data:
  01-create-batch-database.sh: |
    #!/bin/sh
    set -eu
    psql --set ON_ERROR_STOP=1 \
      --username "$POSTGRES_USER" \
      --dbname "$POSTGRES_DB" \
      --command 'CREATE DATABASE ecommerce_ops'
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kestra-postgres
  namespace: kestra
  labels:
    app.kubernetes.io/name: kestra-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/instance: kestra
spec:
  serviceName: kestra-postgres-headless
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: kestra-postgres
      app.kubernetes.io/component: database
      app.kubernetes.io/instance: kestra
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kestra-postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/instance: kestra
    spec:
      terminationGracePeriodSeconds: 120
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: postgres
          image: postgres:16.13-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: kestra
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: kestra-secrets
                  key: KESTRA_DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kestra-secrets
                  key: KESTRA_DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - pg_isready --username="$POSTGRES_USER" --dbname="$POSTGRES_DB"
            initialDelaySeconds: 2
            periodSeconds: 2
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - pg_isready --username="$POSTGRES_USER" --dbname="$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d/01-create-batch-database.sh
              subPath: 01-create-batch-database.sh
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: kestra-postgres-init
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: kestra-postgres
          app.kubernetes.io/component: database
          app.kubernetes.io/instance: kestra
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard-rwo
        resources:
          requests:
            storage: 10Gi
