services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BATCH_DB: ${BATCH_DB}
      BATCH_DB_USER: ${BATCH_DB_USER}
      BATCH_DB_PASSWORD: ${BATCH_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-batch-db.sh:/docker-entrypoint-initdb.d/20-init-batch-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  kestra:
    image: kestra/kestra:latest
    user: "root"
    command: server standalone --worker-thread=64 --config /etc/kestra/application.yaml
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KESTRA_DB_URL: ${KESTRA_DB_URL}
      KESTRA_DB_USERNAME: ${KESTRA_DB_USERNAME}
      KESTRA_DB_PASSWORD: ${KESTRA_DB_PASSWORD}
      KESTRA_URL: ${KESTRA_URL}
      KESTRA_STORAGE_TYPE: ${KESTRA_STORAGE_TYPE}
      KESTRA_LOCAL_STORAGE_PATH: ${KESTRA_LOCAL_STORAGE_PATH}
      KESTRA_BASIC_AUTH_USERNAME: ${KESTRA_BASIC_AUTH_USERNAME}
      KESTRA_BASIC_AUTH_PASSWORD: ${KESTRA_BASIC_AUTH_PASSWORD}
      KESTRA_SERVER_BASIC__AUTH_USERNAME: ${KESTRA_BASIC_AUTH_USERNAME}
      KESTRA_SERVER_BASIC__AUTH_PASSWORD: ${KESTRA_BASIC_AUTH_PASSWORD}
      ENV_BATCH_DB_URL: ${ENV_BATCH_DB_URL}
      ENV_BATCH_DB_USERNAME: ${ENV_BATCH_DB_USERNAME}
      ENV_BATCH_DB_PASSWORD: ${ENV_BATCH_DB_PASSWORD}
      ENV_FEDERATED_GCE_A_URL: ${ENV_FEDERATED_GCE_A_URL}
      ENV_FEDERATED_GCE_A_USERNAME: ${ENV_FEDERATED_GCE_A_USERNAME}
      ENV_FEDERATED_GCE_A_PASSWORD: ${ENV_FEDERATED_GCE_A_PASSWORD}
      ENV_FEDERATED_GCE_B_URL: ${ENV_FEDERATED_GCE_B_URL}
      ENV_FEDERATED_GCE_B_USERNAME: ${ENV_FEDERATED_GCE_B_USERNAME}
      ENV_FEDERATED_GCE_B_PASSWORD: ${ENV_FEDERATED_GCE_B_PASSWORD}
      ENV_REMOTE_BATCH_HOST: ${ENV_REMOTE_BATCH_HOST:-remote-worker}
      ENV_REMOTE_BATCH_USERNAME: ${ENV_REMOTE_BATCH_USERNAME:-batch}
      SECRET_REMOTE_BATCH_PASSWORD: ${SECRET_REMOTE_BATCH_PASSWORD:-cmVtb3RlLWJhdGNoLWxvY2Fs}
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - kestra-data:/app/storage
      - /tmp/kestra-wd:/tmp/kestra-wd
      - ../../kestra/config/application.yaml:/etc/kestra/application.yaml:ro
      - ../../batches:/app/kestra-playground/batches:ro

  remote-worker:
    build:
      context: ./remote-worker
    environment:
      REMOTE_BATCH_PASSWORD: ${REMOTE_BATCH_PASSWORD:-remote-batch-local}
    healthcheck:
      test: ["CMD-SHELL", "ssh-keyscan -4 -T 2 127.0.0.1 >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres-data:
  kestra-data:
