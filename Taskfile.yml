version: '3'

vars:
  PACKAGE_NAME: kestra-playground
  MODULE_NAME: kestra_playground

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  sync:
    desc: Sync project dependencies with uv
    cmds:
      - uv sync --dev

  lock:
    desc: Refresh uv.lock
    cmds:
      - uv lock

  run:
    desc: Run the application
    cmds:
      - uv run python -m {{.MODULE_NAME}}

  test:
    desc: Run tests
    cmds:
      - uv run pytest

  test-verbose:
    desc: Run tests with verbose output
    cmds:
      - uv run pytest -vv

  test-cov:
    desc: Run tests with coverage
    cmds:
      - uv run pytest --cov={{.MODULE_NAME}} --cov-report=term-missing

  lint:
    desc: Run Ruff lint checks
    cmds:
      - uv run ruff check .

  typecheck:
    desc: Run ty type checks
    cmds:
      - uv run ty check .

  fmt:
    desc: Format code with Ruff
    cmds:
      - uv run ruff format .

  fmt-check:
    desc: Check formatting without modifying files
    cmds:
      - uv run ruff format --check .

  build:
    desc: Build the package
    cmds:
      - uv build

  gitleaks:
    desc: Scan staged changes for secrets before commit
    cmds:
      - gitleaks git --pre-commit --redact --staged --verbose

  kestra:local:apple:start:
    desc: Start local Kestra and PostgreSQL with Apple container
    cmds:
      - local/apple-container/start.sh

  kestra:local:apple:stop:
    desc: Stop local Apple container Kestra services
    cmds:
      - local/apple-container/stop.sh

  kestra:local:docker:start:
    desc: Start local Kestra and PostgreSQL with Docker Compose fallback
    cmds:
      - local/docker/start.sh

  kestra:local:docker:stop:
    desc: Stop local Docker Compose Kestra services
    cmds:
      - local/docker/stop.sh

  kestra:flows:register:
    desc: Register local EC Kestra flows against KESTRA_URL or localhost
    cmds:
      - |
        env_file="${KESTRA_ENV_FILE:-}"
        if [ -z "$env_file" ]; then
          if [ -f batch-groups/ec/config/envs/local.env ]; then
            env_file=batch-groups/ec/config/envs/local.env
          else
            env_file=batch-groups/ec/config/envs/local.env.example
          fi
        fi
        set -a
        . "$env_file"
        set +a
        KESTRA_ENV_FILE="$env_file" scripts/register-flows.sh "${KESTRA_URL:-http://localhost:8080}" batch-groups/ec/flows

  kestra:affiliate:flows:register:
    desc: Register local affiliate flows against AFFILIATE_KESTRA_URL, its group env, or localhost
    cmds:
      - |
        env_file="${KESTRA_ENV_FILE:-}"
        if [ -z "$env_file" ]; then
          if [ -f batch-groups/affiliate/config/envs/local.env ]; then
            env_file=batch-groups/affiliate/config/envs/local.env
          else
            env_file=batch-groups/affiliate/config/envs/local.env.example
          fi
        fi
        set -a
        . "$env_file"
        set +a
        KESTRA_ENV_FILE="$env_file" scripts/register-flows.sh "${AFFILIATE_KESTRA_URL:-${KESTRA_URL:-http://localhost:8082}}" batch-groups/affiliate/flows

  kestra:affiliate:flows:generate:
    desc: Execute the affiliate mock data generator flow
    cmds:
      - |
        env_file="${KESTRA_ENV_FILE:-}"
        if [ -z "$env_file" ]; then
          if [ -f batch-groups/affiliate/config/envs/local.env ]; then
            env_file=batch-groups/affiliate/config/envs/local.env
          else
            env_file=batch-groups/affiliate/config/envs/local.env.example
          fi
        fi
        set -a
        . "$env_file"
        set +a
        NAMESPACE=playground.affiliate KESTRA_ENV_FILE="$env_file" scripts/run-flow.sh generate_affiliate_mock_data "${BUSINESS_DATE:-}" "${AFFILIATE_KESTRA_URL:-${KESTRA_URL:-http://localhost:8082}}"

  kestra:affiliate:flows:report:
    desc: Execute the affiliate daily report flow
    cmds:
      - |
        env_file="${KESTRA_ENV_FILE:-}"
        if [ -z "$env_file" ]; then
          if [ -f batch-groups/affiliate/config/envs/local.env ]; then
            env_file=batch-groups/affiliate/config/envs/local.env
          else
            env_file=batch-groups/affiliate/config/envs/local.env.example
          fi
        fi
        set -a
        . "$env_file"
        set +a
        NAMESPACE=playground.affiliate KESTRA_ENV_FILE="$env_file" scripts/run-flow.sh build_affiliate_daily_report "${BUSINESS_DATE:-}" "${AFFILIATE_KESTRA_URL:-${KESTRA_URL:-http://localhost:8082}}"

  kestra:affiliate:flows:rankings:
    desc: Execute the affiliate partner rankings flow
    cmds:
      - |
        env_file="${KESTRA_ENV_FILE:-}"
        if [ -z "$env_file" ]; then
          if [ -f batch-groups/affiliate/config/envs/local.env ]; then
            env_file=batch-groups/affiliate/config/envs/local.env
          else
            env_file=batch-groups/affiliate/config/envs/local.env.example
          fi
        fi
        set -a
        . "$env_file"
        set +a
        NAMESPACE=playground.affiliate KESTRA_ENV_FILE="$env_file" scripts/run-flow.sh build_affiliate_partner_rankings "${BUSINESS_DATE:-}" "${AFFILIATE_KESTRA_URL:-${KESTRA_URL:-http://localhost:8082}}"

  kestra:flows:generate:
    desc: Execute the ecommerce mock data generator flow
    cmds:
      - |
        env_file="${KESTRA_ENV_FILE:-}"
        if [ -z "$env_file" ]; then
          if [ -f batch-groups/ec/config/envs/local.env ]; then
            env_file=batch-groups/ec/config/envs/local.env
          else
            env_file=batch-groups/ec/config/envs/local.env.example
          fi
        fi
        set -a
        . "$env_file"
        set +a
        KESTRA_ENV_FILE="$env_file" scripts/run-flow.sh generate_ecommerce_mock_data "${BUSINESS_DATE:-}" "${KESTRA_URL:-http://localhost:8080}"

  kestra:flows:report:
    desc: Execute the ecommerce daily report flow
    cmds:
      - |
        env_file="${KESTRA_ENV_FILE:-}"
        if [ -z "$env_file" ]; then
          if [ -f batch-groups/ec/config/envs/local.env ]; then
            env_file=batch-groups/ec/config/envs/local.env
          else
            env_file=batch-groups/ec/config/envs/local.env.example
          fi
        fi
        set -a
        . "$env_file"
        set +a
        KESTRA_ENV_FILE="$env_file" scripts/run-flow.sh build_ecommerce_daily_report "${BUSINESS_DATE:-}" "${KESTRA_URL:-http://localhost:8080}"

  kestra:flows:segments:
    desc: Execute the ecommerce customer segments flow
    cmds:
      - |
        env_file="${KESTRA_ENV_FILE:-}"
        if [ -z "$env_file" ]; then
          if [ -f batch-groups/ec/config/envs/local.env ]; then
            env_file=batch-groups/ec/config/envs/local.env
          else
            env_file=batch-groups/ec/config/envs/local.env.example
          fi
        fi
        set -a
        . "$env_file"
        set +a
        KESTRA_ENV_FILE="$env_file" scripts/run-flow.sh build_ecommerce_customer_segments "${BUSINESS_DATE:-}" "${KESTRA_URL:-http://localhost:8080}"

  kestra:flows:run-federated-local:
    desc: Register server namespaces and run the OSS federated ecommerce batch locally
    cmds:
      - scripts/verify-local-federated.sh "${BUSINESS_DATE:-}"

  kestra:flows:run-operation-demo-local:
    desc: Unit-check the shared operation demo batch source and run its local Kestra flow
    cmds:
      - scripts/verify-local-operation-demo.sh "${BUSINESS_DATE:-}"

  kestra:flows:run-remote-batch-examples:
    desc: Run two Python batches on the local SSH worker and verify Kestra failure propagation
    cmds:
      - scripts/verify-local-remote-batch.sh "${BUSINESS_DATE:-}"

  kestra:flows:run-batch-group-broadcast-local:
    desc: Run the broadcast batch on two local workers using a built tacogips/kestra fork
    cmds:
      - scripts/verify-local-batch-group-broadcast.sh "${BUSINESS_DATE:-}"

  kestra:flows:audit-federated-topology:
    desc: Audit the OSS federated topology for GKE controller-only and two sticky GCE workers
    cmds:
      - scripts/audit-federated-topology.sh

  kestra:batch-groups:deploy:ec:
    desc: Register EC batch group flows against a target Kestra (local by default)
    cmds:
      - scripts/deploy-batch-group.sh ec "${KESTRA_DEPLOY_URL:-}"

  kestra:batch-groups:deploy:affiliate:
    desc: Register affiliate batch group flows against a target Kestra (local by default)
    cmds:
      - scripts/deploy-batch-group.sh affiliate "${KESTRA_DEPLOY_URL:-}"

  kestra:live:deploy:
    desc: Deploy live GCP environments from kinko-backed generated tfvars
    cmds:
      - scripts/deploy-live-environments.sh "${TARGET_ENVIRONMENT:-all}"

  kestra:live:deploy:federated:
    desc: Deploy the OSS federated live topology with GCE child Kestra and GKE controller/child Kestra
    cmds:
      - scripts/deploy-federated-live.sh

  kestra:live:deploy:routed:
    desc: Deploy the OSS shared-backend routed live topology with GKE control plane and GCE workers
    cmds:
      - scripts/deploy-routed-live.sh

  kestra:live:verify:
    desc: Register flows and verify live HTTPS endpoints without running the batch
    cmds:
      - scripts/verify-live-environments.sh "${TARGET_ENVIRONMENT:-all}" "${BUSINESS_DATE:-}" health

  kestra:live:run-batch:
    desc: Register flows and run the ecommerce batch against live environments
    cmds:
      - scripts/verify-live-environments.sh "${TARGET_ENVIRONMENT:-all}" "${BUSINESS_DATE:-}" run-batch

  kestra:live:run-federated:
    desc: Register child/controller flows and run the OSS federated ecommerce batch
    cmds:
      - scripts/verify-live-federated.sh "${BUSINESS_DATE:-}"

  kestra:live:run-routed:
    desc: Register and run the OSS shared-backend worker routing verification flow
    cmds:
      - scripts/verify-live-routed.sh "${BUSINESS_DATE:-}"

  kestra:live:run-batch-group-broadcast:
    desc: Run one routed batch on every worker in a shared batch group
    cmds:
      - scripts/verify-live-batch-group-broadcast.sh "${BUSINESS_DATE:-}"

  kestra:live:run-gke-node-routing:
    desc: Register and run the OSS GKE placement-constrained worker routing verification flow
    cmds:
      - scripts/verify-live-gke-node-routing.sh "${BUSINESS_DATE:-}"

  kestra:live:run-k8s-pod-resources:
    desc: Register and run the OSS K8s per-batch pod resource verification flow
    cmds:
      - scripts/verify-live-k8s-pod-resources.sh

  kestra:live:run-operation-demo-gke-pod-resources:
    desc: Run the shared operation demo batch source in GKE PodCreate pods with different resources
    cmds:
      - scripts/verify-live-operation-demo-gke-pod-resources.sh

  kestra:live:run-operation-demo-routed:
    desc: Run the shared operation demo batch source on selected routed GCE/on-prem-style workers
    cmds:
      - scripts/verify-live-operation-demo-routed.sh "${BUSINESS_DATE:-}"

  kestra:live:run-remote-batch-routed:
    desc: Run Namespace File Python batches on scale-from-zero GKE routed workers
    cmds:
      - scripts/verify-live-remote-batch-routed.sh "${BUSINESS_DATE:-}"

  infra:fmt:
    desc: Format Terraform/OpenTofu files
    cmds:
      - tofu fmt -recursive infra/terraform

  scripts:check:
    desc: Run syntax and ShellCheck validation for repository shell scripts
    cmds:
      - |
        {
          git ls-files -z -- '*.sh'
          git ls-files -z --others --exclude-standard -- '*.sh'
        } | xargs -0 -n 1 bash -n
      - |
        {
          git ls-files -z -- '*.sh'
          git ls-files -z --others --exclude-standard -- '*.sh'
        } | xargs -0 shellcheck -x

  k8s:build:dev:
    desc: Render the dev Kustomize overlay
    cmds:
      - kustomize build k8s/overlays/dev

  k8s:apply:dev:
    desc: Apply the dev GKE overlay using Terraform outputs for live secrets
    cmds:
      - scripts/apply-gke-dev.sh

  webconsole:install:
    desc: Install web console dependencies with bun
    dir: webconsole
    cmds:
      - bun install

  webconsole:build:
    desc: Build the web console frontend
    dir: webconsole
    cmds:
      - bun run build

  webconsole:typecheck:
    desc: Typecheck the web console TypeScript sources
    dir: webconsole
    cmds:
      - bunx tsc --noEmit

  webconsole:serve:
    desc: Run the web console server locally (uses webconsole/.env via direnv or exported vars)
    dir: webconsole
    cmds:
      - bun run serve

  webconsole:secrets:
    desc: Register web console runtime values in Secret Manager (values from env/kinko)
    cmds:
      - scripts/setup-webconsole-secrets.sh

  webconsole:deploy:
    desc: Deploy the web console to Cloud Run
    cmds:
      - scripts/deploy-webconsole.sh

  install-git-hooks:
    desc: Install the Nix-managed pre-commit hook configuration
    cmds:
      - nix develop -c pre-commit install --install-hooks

  clean:
    desc: Remove generated artifacts
    cmds:
      - rm -rf build dist htmlcov .coverage .pytest_cache .ruff_cache src/*.egg-info

  ci:
    desc: Run the standard CI checks
    cmds:
      - task: fmt-check
      - task: lint
      - task: typecheck
      - task: test
      - task: build
