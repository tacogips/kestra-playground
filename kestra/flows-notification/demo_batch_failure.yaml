id: demo_batch_failure
namespace: playground.notification
description: Failing demo batch used to verify the FAILED notification path.

labels:
  environment: playground
  domain: notification

tasks:
  - id: load_data
    type: io.kestra.plugin.core.log.Log
    message: "demo batch loaded {{ execution.id }}"

  - id: publish_report
    type: io.kestra.plugin.core.execution.Fail
    errorMessage: "simulated downstream failure"
