id: parse_application_logs
namespace: playground.remote_batch
description: Copy the log parser to a configured worker and retain its JSON summary artifact.

labels:
  pattern: remote-python-batch
  example: log-parse

inputs:
  - id: business_date
    type: DATE
    required: true
    defaults: "2026-06-25"

  - id: worker_host
    type: STRING
    defaults: "{{ envs.remote_batch_host }}"

  - id: worker_port
    type: INT
    defaults: 22

  - id: worker_username
    type: STRING
    defaults: "{{ envs.remote_batch_username }}"

  - id: worker_password_secret
    type: STRING
    defaults: REMOTE_BATCH_PASSWORD

  - id: log_path
    type: STRING
    defaults: /opt/batch-inputs/application.jsonl

tasks:
  - id: run_remote_batch
    type: io.kestra.plugin.core.flow.Subflow
    namespace: playground.remote_batch
    flowId: remote_batch_runner
    wait: true
    transmitFailed: true
    inputs:
      script_name: batches/log_parse/parse_logs.py
      config_json: >-
        {"input_path":"{{ inputs.log_path }}","business_date":"{{ inputs.business_date }}"}
      output_file: "log-summary-{{ inputs.business_date }}.json"
      worker_host: "{{ inputs.worker_host }}"
      worker_port: "{{ inputs.worker_port }}"
      worker_username: "{{ inputs.worker_username }}"
      worker_password_secret: "{{ inputs.worker_password_secret }}"

outputs:
  - id: artifact
    type: FILE
    value: "{{ outputs.run_remote_batch.outputs is defined ? outputs.run_remote_batch.outputs.artifact : 'nsfile:///batches/log_parse/parse_logs.py' }}"

  - id: artifact_checksum
    type: STRING
    value: "{{ outputs.run_remote_batch.outputs is defined ? outputs.run_remote_batch.outputs.artifact_checksum : 'not-collected' }}"
