[tasks."kestra:flows:register"]
description = "Register local EC Kestra flows against KESTRA_URL or localhost"
run = '''
env_file="${KESTRA_ENV_FILE:-}"
if [ -z "$env_file" ]; then
  if [ -f batch-groups/ec/config/envs/local.env ]; then
    env_file=batch-groups/ec/config/envs/local.env
  else
    env_file=batch-groups/ec/config/envs/local.env.example
  fi
fi
set -a
. "$env_file"
set +a
KESTRA_ENV_FILE="$env_file" scripts/register-flows.sh "${KESTRA_URL:-http://localhost:8080}" batch-groups/ec/flows

'''

