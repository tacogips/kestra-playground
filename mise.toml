[tasks."scripts:check"]
description = "Run syntax and ShellCheck validation for repository shell scripts"
run = '''
{
  git ls-files -z -- '*.sh'
  git ls-files -z --others --exclude-standard -- '*.sh'
} | xargs -0 -n 1 bash -n

{
  git ls-files -z -- '*.sh'
  git ls-files -z --others --exclude-standard -- '*.sh'
} | xargs -0 shellcheck -x

'''

