min_version = "2026.8.3"

[[hooks.enter]]
shell = "bash"
script = '''
if command -v kinko >/dev/null 2>&1 && kinko hook --help >/dev/null 2>&1; then
  eval "$(kinko --path "$MISE_PROJECT_ROOT" hook enter bash)"
fi
'''

[[hooks.leave]]
shell = "bash"
script = '''
if command -v kinko >/dev/null 2>&1 && kinko hook --help >/dev/null 2>&1; then
  eval "$(kinko hook leave bash)"
fi
'''

[tools]
python = "3.12"
uv = "latest"
java = "25"
github-cli = "latest"
gcloud = "latest"
opentofu = "latest"
kubectl = "latest"
helm = "latest"
kustomize = "latest"
"github:theseus-rs/postgresql-binaries" = "16.14.0"
jq = "latest"
yq = "latest"
shellcheck = "latest"
"github:docker/compose" = "latest"
gitleaks = "latest"
pre-commit = "latest"

[tasks."default"]
description = "Show available tasks"
run = '''
mise tasks ls
'''

[tasks."sync"]
description = "Sync project dependencies with uv"
run = '''
uv sync --dev
'''

[tasks."lock"]
description = "Refresh uv.lock"
run = '''
uv lock
'''

[tasks."run"]
description = "Run the application"
run = '''
uv run python -m kestra_playground
'''

[tasks."test"]
description = "Run tests"
run = '''
uv run pytest
'''

[tasks."test-verbose"]
description = "Run tests with verbose output"
run = '''
uv run pytest -vv
'''

[tasks."test-cov"]
description = "Run tests with coverage"
run = '''
uv run pytest --cov=kestra_playground --cov-report=term-missing
