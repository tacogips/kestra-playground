name: Deploy Tagged Category Logic to Staging

on:
  push:
    tags:
      - "orders-v*"

permissions:
  contents: read

concurrency:
  group: category-logic-staging
  cancel-in-progress: false

jobs:
  build:
    name: Build Tagged Release Bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s\n' "$RELEASE_TAG" | grep -Eq '^orders-v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Release tag must match orders-vX.Y.Z: $RELEASE_TAG" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag commit is not part of main: $GITHUB_SHA" >&2
            exit 1
          fi
          version="${RELEASE_TAG#orders-v}"
          printf 'version=%s\n' "$version" >>"$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build immutable tagged bundle
        env:
          LOGIC_IMAGE: localhost/kestra-category/orders:${{ steps.release.outputs.version }}
          LOGIC_REVISION: ${{ github.sha }}
          LOGIC_VERSION: ${{ steps.release.outputs.version }}
        run: |
          scripts/build-category-logic-bundle.sh \
            dist/category-logic-staging \
            "$LOGIC_VERSION" \
            "$LOGIC_REVISION" \
            "$LOGIC_IMAGE"
      - name: Upload tagged release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orders-release-${{ steps.release.outputs.version }}
          path: dist/category-logic-staging/
          if-no-files-found: error
          retention-days: 90

  deploy:
    name: Persist and Deploy Staging Bundle
    needs: build
    runs-on: [self-hosted, onprem, category-deploy]
    timeout-minutes: 30
    environment:
      name: staging
    permissions:
      contents: read
    env:
      CATEGORY_LOGIC_INVENTORY: ${{ vars.CATEGORY_LOGIC_INVENTORY }}
      CATEGORY_LOGIC_RELEASE_STORE: ${{ vars.CATEGORY_LOGIC_RELEASE_STORE }}
      CATEGORY_LOGIC_TARGET_GROUP: ${{ vars.CATEGORY_LOGIC_TARGET_GROUP }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise tools
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - name: Download tagged release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: orders-release-${{ needs.build.outputs.version }}
          path: bundle
      - name: Persist immutable staging release
        id: persist
        run: |
          : "${CATEGORY_LOGIC_RELEASE_STORE:?Set the staging environment release-store variable}"
          release_directory="$(
            mise exec -- scripts/persist-category-logic-release.sh \
              bundle \
              "$CATEGORY_LOGIC_RELEASE_STORE"
          )"
          printf 'release_directory=%s\n' "$release_directory" >>"$GITHUB_OUTPUT"
      - name: Deploy staging from the persistent release store
        env:
          RELEASE_DIRECTORY: ${{ steps.persist.outputs.release_directory }}
        run: |
          : "${CATEGORY_LOGIC_INVENTORY:?Set the staging environment inventory variable}"
          : "${CATEGORY_LOGIC_TARGET_GROUP:?Set the staging environment target-group variable}"
          mise exec -- scripts/deploy-category-logic-bundle.sh \
            "$RELEASE_DIRECTORY" \
            "$CATEGORY_LOGIC_INVENTORY" \
            "$CATEGORY_LOGIC_TARGET_GROUP"
