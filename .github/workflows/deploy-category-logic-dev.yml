name: Deploy Category Logic to Development

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: category-logic-development
  cancel-in-progress: false

jobs:
  build:
    name: Build Development Bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build immutable development bundle
        env:
          LOGIC_IMAGE: localhost/kestra-category/orders:dev-${{ github.sha }}
          LOGIC_REVISION: ${{ github.sha }}
          LOGIC_VERSION: dev-${{ github.sha }}
        run: |
          scripts/build-category-logic-bundle.sh \
            dist/category-logic-dev \
            "$LOGIC_VERSION" \
            "$LOGIC_REVISION" \
            "$LOGIC_IMAGE"
      - name: Upload development bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orders-dev-${{ github.sha }}
          path: dist/category-logic-dev/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy Development Bundle
    needs: build
    runs-on: [self-hosted, onprem, category-deploy]
    timeout-minutes: 30
    environment:
      name: development
    permissions:
      contents: read
    env:
      CATEGORY_LOGIC_INVENTORY: ${{ vars.CATEGORY_LOGIC_INVENTORY }}
      CATEGORY_LOGIC_TARGET_GROUP: ${{ vars.CATEGORY_LOGIC_TARGET_GROUP }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise tools
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - name: Download development bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: orders-dev-${{ github.sha }}
          path: bundle
      - name: Deploy development to the shared worker inventory
        run: |
          : "${CATEGORY_LOGIC_INVENTORY:?Set the development environment inventory variable}"
          : "${CATEGORY_LOGIC_TARGET_GROUP:?Set the development environment target-group variable}"
          mise exec -- scripts/deploy-category-logic-bundle.sh \
            bundle \
            "$CATEGORY_LOGIC_INVENTORY" \
            "$CATEGORY_LOGIC_TARGET_GROUP"
