name: Deploy Tagged Category Controller Flows

on:
  push:
    tags:
      - "orders-controller-v*"

permissions:
  contents: read

concurrency:
  group: category-controller-development
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Controller Release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s\n' "$RELEASE_TAG" | grep -Eq '^orders-controller-v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Release tag must match orders-controller-vX.Y.Z: $RELEASE_TAG" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Controller release tag commit is not part of main: $GITHUB_SHA" >&2
            exit 1
          fi
          version="${RELEASE_TAG#orders-controller-v}"
          printf 'version=%s\n' "$version" >>"$GITHUB_OUTPUT"
      - name: Install mise tools
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - name: Run project and script checks
        run: |
          mise run ci
          mise run scripts:check

  deploy:
    name: Deploy Controller Flows Without Restart
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: development
      url: ${{ vars.LIVE_K8S_URL }}
    permissions:
      contents: read
      id-token: write
    env:
      CATEGORY_CONTROLLER_VERSION: ${{ needs.validate.outputs.version }}
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: asia-northeast1
      KESTRA_URL: ${{ vars.LIVE_K8S_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise tools
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Deploy and verify controller flows
        run: mise exec -- scripts/deploy-category-controller-flows.sh "$CATEGORY_CONTROLLER_VERSION"
